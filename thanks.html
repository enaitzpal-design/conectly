<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You're in · Conectly</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
  :root{--blue:#0a66c2;--bg:#f4f2ee;--ink:rgba(0,0,0,.9);--muted:#3d4248}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:'Source Sans 3',system-ui,sans-serif;padding:24px 16px}
  main{max-width:520px;width:100%}
  .logo{font-weight:700;letter-spacing:-.05em;color:var(--blue);font-size:56px;line-height:1;margin:0 0 32px}
  h1{font-size:40px;line-height:1.1;letter-spacing:-.03em;margin:0 0 12px}
  p{font-size:20px;line-height:1.45;color:var(--muted);margin:0 0 16px}
  .card{background:#fff;border-radius:20px;padding:20px 22px;box-shadow:0 12px 30px rgba(16,24,40,.08);margin-top:24px}
  .card b{color:var(--ink)}
  small{display:block;margin-top:32px;color:#6b7280;font-size:15px}
  small a{color:var(--blue)}
</style>

<!-- Píxel de Meta. Sustituir PIXEL_ID por el ID del conjunto de datos de Events Manager.
     Solo se carga si la persona dio su consentimiento de medición en el formulario (llega como ?c=1). -->
<script>
(function () {
  var PIXEL_ID = 'PIXEL_ID';
  var q = new URLSearchParams(location.search);
  if (q.get('c') !== '1' || PIXEL_ID === 'PIXEL_ID') return;
  !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
  n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}(window,
  document,'script','https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', PIXEL_ID);
  fbq('track', 'PageView');
  // Un solo Lead por persona: si recarga la página, no se cuenta dos veces.
  try { if (sessionStorage.getItem('conectly_lead')) return; sessionStorage.setItem('conectly_lead', '1'); } catch (e) {}
  fbq('track', 'Lead', { content_name: q.get('source') || 'unknown' });
})();
</script>
</head>
<body>
<main>
  <p class="logo">conectly</p>
  <h1>You're in. Thank you!</h1>
  <p>We'll email you within a few days to set up your first live call with a founder from another country.</p>
  <div class="card">
    <p style="margin:0"><b>Know a founder in another country?</b> Send them the link. The more founders join, the better the match for you.</p>
  </div>
  <small>Questions about your data? Read our <a href="privacy.html">privacy policy</a>.</small>
</main>
</body>
</html>
